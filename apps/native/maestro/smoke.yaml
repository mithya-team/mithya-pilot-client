appId: team.mithya.pilot
---
- launchApp
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible: "Mithya pilot client"
    timeout: 15000
- assertVisible:
    text: "Mock client: Ada Lovelace"
- assertVisible:
    id: "variant-solid"
- assertVisible:
    id: "variant-ghost"
- assertVisible:
    id: "name-input"
- assertVisible:
    id: "save-button"
- tapOn:
    id: "name-input"
- inputText: "Ada"
- tapOn:
    text: "Button variants"
- tapOn:
    id: "save-button"
- scrollUntilVisible:
    element:
      text: "Saved: Ada"
    direction: DOWN
    timeout: 5000
